# Outside uptime check for StoneWave's hosted services. GET-only, no
# credentials against the monitored sites. Alerts go to the signed StoneWave
# ops relay with an uptime-only secret. If the relay itself can't be reached,
# this run fails, and GitHub emails whoever last edited the cron line below.
name: uptime

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      drill:
        description: "fail = test uptime_down; recover = clear it; fallback = test the failed-run email; none = normal run"
        type: choice
        options: [none, fail, recover, fallback]
        default: none

permissions:
  contents: read

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .uptime-state
          # Never a prefix of a saved key, so every attempt (re-runs too)
          # restores the newest state, not its own run's older copy.
          key: uptime-restore-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: uptime-state-
      - name: Check targets
        env:
          SP_ALERT_URL: ${{ secrets.SP_ALERT_URL }}
          SP_ALERT_SECRET: ${{ secrets.SP_UPTIME_ALERT_SECRET }}
          UPTIME_DRILL: ${{ inputs.drill || 'none' }}
        run: python3 uptime_check.py --targets targets.json --state .uptime-state/state.json
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: .uptime-state
          key: uptime-state-${{ github.run_id }}-${{ github.run_attempt }}
