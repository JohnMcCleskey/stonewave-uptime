# Unit tests only. No secrets are used here, so pull requests from forks are safe.
name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Unit tests (standard library only)
        run: python3 -m unittest discover -s . -p 'test_*.py' -v
